[project]
name = "hamstring-length-repeated-sprints"
version = "1.0.0"
description = "Analysis pipeline for hamstring muscle-fiber mechanics during repeated sprint exercise"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"

[tool.pytest.ini_options]
pythonpath = [
  "."
]
[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E", "W"]
ignore = ["D100", "T201", "C901", "PLR0912", "PLR0913", "PLR0915", "S314", "ERA001", "E501"]
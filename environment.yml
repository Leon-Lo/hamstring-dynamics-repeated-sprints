name: opensim
channels:
  - defaults
  - conda-forge
dependencies:
  - python>=3.10
  - numpy>=2.0,<3
  # - libcxx # Uncomment if on macOS
  - opensim-org::opensim>=4.5
  - pandas>=3.0,<4
  - matplotlib>=3.10,<4
  - ipykernel
  - pytest
  - pytest-mock
  - scipy>=1.17,<2
  - scikit-learn>=1.8,<2
  - statsmodels>=0.14,<1
  - tqdm
  - seaborn>=0.13,<1
  - pingouin>=0.6,<1
  - pip
  - pip:
    - spm1d==0.4.53
    - thefuzz==0.22.1

### To create the environment, run: conda env create -n opensim -f environment.yml ###
### To update the environment, run: conda env update -n opensim -f environment.yml ###